<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg">
  <title>Dashboard · CFB Admin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="admin-shell">
    <div id="nav"></div>

    <div class="admin-main">
      <header id="pageHeader" class="page-header" data-title="Admin Dashboard"></header>

      <div class="admin-body teal">
        <div id="message" class="message" hidden></div>

        <div class="stats">
          <div class="card card-pad stat">
            <div><div class="label">Total Facilities</div><div class="value" id="facilityCount">–</div></div>
            <span class="pic pic-blue" id="icoFacilities"></span>
          </div>
          <div class="card card-pad stat">
            <div><div class="label">Today's Bookings</div><div class="value" id="todayCount">–</div></div>
            <span class="pic pic-green" id="icoToday"></span>
          </div>
          <div class="card card-pad stat">
            <div><div class="label">Pending Approvals</div><div class="value" id="pendingCount">–</div></div>
            <span class="pic pic-amber" id="icoPending"></span>
          </div>
          <div class="card card-pad stat">
            <div><div class="label">Active Users</div><div class="value" id="userCount">–</div></div>
            <span class="pic pic-blue" id="icoUsers"></span>
          </div>
        </div>

        <h2 class="section-title" style="color:#fff">Recent Bookings</h2>
        <div class="card table-wrap">
          <table>
            <thead>
              <tr><th>User</th><th>Facility</th><th>Date</th><th>Status</th><th>Quick Action</th></tr>
            </thead>
            <tbody id="recent"></tbody>
          </table>
        </div>

        <h2 class="section-title" style="color:#fff">Pending Approvals Queue</h2>
        <div id="queue"></div>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script src="js/admin-dashboard.js"></script>
</body>
</html>
