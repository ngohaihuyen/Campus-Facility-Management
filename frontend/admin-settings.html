<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg">
  <title>Settings · CFB Admin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="admin-shell">
    <div id="nav"></div>

    <div class="admin-main">
      <header id="pageHeader" class="page-header" data-title="Settings"></header>

      <div class="admin-body">
        <div class="two-col">
          <section class="card card-pad">
            <h2>Profile</h2>
            <div class="summary" style="border-top:0;margin-top:8px;padding-top:0">
              <div class="line"><span class="muted">Name</span> <b id="name"></b></div>
              <div class="line"><span class="muted">Email</span> <b id="email"></b></div>
              <div class="line"><span class="muted">Role</span> <b id="role"></b></div>
            </div>
          </section>

          <section class="card card-pad">
            <h2>Change password</h2>
            <div id="message" class="message" hidden style="margin-top:12px"></div>
            <form id="passwordForm" style="margin-top:12px">
              <div class="field">
                <label for="currentPassword">Current password</label>
                <input id="currentPassword" type="password" required autocomplete="current-password">
              </div>
              <div class="field">
                <label for="newPassword">New password (at least 8 characters)</label>
                <input id="newPassword" type="password" minlength="8" required autocomplete="new-password">
              </div>
              <div class="field">
                <label for="confirmPassword">Repeat new password</label>
                <input id="confirmPassword" type="password" minlength="8" required autocomplete="new-password">
              </div>
              <button class="btn" type="submit">Change password</button>
            </form>
          </section>
        </div>
      </div>
    </div>
  </div>

  <script src="js/common.js"></script>
  <script>const ACCOUNT_ROLES = ['ADMIN'];</script>
  <script src="js/account.js"></script>
</body>
</html>
